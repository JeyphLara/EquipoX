# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
    
permissions:
  contents: write
  pull-requests: write
  repository-projects: write
  id-token: write
  packages: write
  actions: read
  security-events: write  # este es importante para dependency submission

jobs:
  build:

    runs-on: ubuntu-latest


    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B verify --file pom.xml

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build jar
      run: mvn clean package -DskipTests

    - name: Copy jar to EC2
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: /target/AppEquipox-0.0.1-SNAPSHOT.jar
        target: /home/ec2-user/

    - name: Deploy on EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          ls -lh /home/ec2-user/target/
          docker stop apiequipox || true
          docker rm apiequipox || true
          docker build -t apiequipox .
          docker run -d \
            --name apiequipox \
            -p 9525:9525 \
            -e POSTGRES_DB_HOST=${{ secrets.POSTGRES_DB_HOST }} \
            -e POSTGRES_DB_PORT=${{ secrets.POSTGRES_DB_PORT }} \
            -e POSTGRES_DB_USER=${{ secrets.POSTGRES_DB_USER }} \
            -e POSTGRES_DB_PASS=${{ secrets.POSTGRES_DB_PASS }} \
            -e POSTGRES_DB_NAME=${{ secrets.POSTGRES_DB_NAME }} \
            apiequipox
